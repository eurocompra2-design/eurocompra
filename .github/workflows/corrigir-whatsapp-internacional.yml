name: Corrigir WhatsApp internacional

on:
  push:
    paths:
      - '.github/workflows/corrigir-whatsapp-internacional.yml'

permissions:
  contents: write

jobs:
  patch-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir formulário de WhatsApp
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<!-- EUROCOMPRA-WHATSAPP-INTERNACIONAL -->'
          if marker in html:
              print('Correção já aplicada.')
              raise SystemExit(0)

          css = '''
          <style id="eurocompra-whatsapp-style">
            .phone-row{grid-template-columns:minmax(190px,1.15fr) minmax(120px,.65fr) minmax(180px,1.35fr);gap:10px;align-items:start}
            .phone-prefix,.phone-area{background:#f7faff;color:#063b9e;font-weight:700}
            .phone-prefix:focus,.phone-area:focus,#whatsapp:focus{outline:3px solid rgba(6,59,158,.12);border-color:#063b9e}
            .phone-area.optional{background:#fff;color:#172033;font-weight:400}
            .phone-status{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#667085}
            .phone-status strong{color:#063b9e}
            @media(max-width:850px){.phone-row{grid-template-columns:1fr}}
          </style>
          '''

          js = r'''
          <!-- EUROCOMPRA-WHATSAPP-INTERNACIONAL -->
          <script id="eurocompra-whatsapp-script">
          (() => {
            const country = document.getElementById('countryCode');
            const area = document.getElementById('whatsappArea');
            const number = document.getElementById('whatsapp');
            const countryName = document.getElementById('countryName');
            const help = document.getElementById('countryHelp');
            const form = document.getElementById('cadastroForm');
            const message = document.getElementById('formMessage');
            if (!country || !area || !number || !form) return;

            const digits = value => String(value || '').replace(/\D/g, '');
            const selectedName = () => country.options[country.selectedIndex]?.dataset.country || '';

            function cleanAreaOnCountryChange() {
              const code = digits(country.value);
              if (digits(area.value) === code || digits(area.value) === '32' || digits(area.value) === '55') area.value = '';
            }

            function updatePhoneUI(clearArea = false) {
              const code = digits(country.value);
              const name = selectedName();
              const brazil = code === '55';
              if (clearArea) area.value = '';
              area.required = brazil;
              area.classList.toggle('optional', !brazil);
              area.placeholder = brazil ? 'DDD' : 'Código/região (opcional)';
              countryName.value = name;
              help.innerHTML = `🌍 <strong>${name}</strong> +${code}. ${brazil ? 'Informe o DDD e depois o número.' : 'Informe o código regional somente se o país utilizar um.'}`;
              let status = document.getElementById('phoneStatus');
              if (!status) {
                status = document.createElement('div');
                status.id = 'phoneStatus';
                status.className = 'phone-status';
                area.parentElement.parentElement.appendChild(status);
              }
              status.innerHTML = `✓ Número internacional: <strong>+${code}${digits(area.value)}${digits(number.value)}</strong>`;
            }

            country.addEventListener('change', () => {
              cleanAreaOnCountryChange();
              number.value = '';
              updatePhoneUI(true);
            });
            [area, number].forEach(input => input.addEventListener('input', () => {
              input.value = digits(input.value);
              updatePhoneUI(false);
            }));

            cleanAreaOnCountryChange();
            updatePhoneUI(false);

            // Assume o controle total do envio para garantir que a API receba
            // sempre um único WhatsApp internacional em formato E.164.
            form.addEventListener('submit', async event => {
              event.preventDefault();
              event.stopImmediatePropagation();

              const code = digits(country.value);
              const areaDigits = digits(area.value);
              const numberDigits = digits(number.value);
              const fullWhatsapp = `+${code}${areaDigits}${numberDigits}`;

              if (code === '55' && areaDigits.length !== 2) {
                message.style.display = 'block';
                message.style.background = '#fff4e5';
                message.style.color = '#9a5b00';
                message.textContent = 'Informe o DDD de 2 dígitos para números do Brasil.';
                area.focus();
                return;
              }
              if (numberDigits.length < 6) {
                message.style.display = 'block';
                message.style.background = '#fff4e5';
                message.style.color = '#9a5b00';
                message.textContent = 'Informe um número de WhatsApp válido.';
                number.focus();
                return;
              }

              const data = {};
              new FormData(form).forEach((value, key) => {
                if (typeof value === 'string') data[key] = value;
              });
              data.pais_codigo = `+${code}`;
              data.pais_whatsapp = selectedName();
              data.whatsapp_area = areaDigits;
              data.whatsapp_numero = numberDigits;
              data.whatsapp = fullWhatsapp;

              const submit = form.querySelector('button[type="submit"],input[type="submit"]');
              if (submit) { submit.disabled = true; submit.dataset.originalText = submit.textContent; submit.textContent = 'Enviando...'; }
              message.style.display = 'none';

              try {
                const response = await fetch('https://eurocompra-api.eurocompra2.workers.dev/api/cadastro', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(data)
                });
                const result = await response.json();
                if (!response.ok || !result.ok) throw new Error(result.message || 'Não foi possível enviar o cadastro.');
                message.style.display = 'block';
                message.style.background = '#eaf8f0';
                message.style.color = '#16804b';
                message.textContent = `Cadastro recebido com segurança. Código: ${result.codigo || 'gerado com sucesso'}.`;
                form.reset();
                country.value = '+55';
                countryName.value = 'Brasil';
                updatePhoneUI(true);
              } catch (error) {
                message.style.display = 'block';
                message.style.background = '#fff0f0';
                message.style.color = '#b42318';
                message.textContent = error.message || 'Não foi possível processar o cadastro.';
              } finally {
                if (submit) { submit.disabled = false; submit.textContent = submit.dataset.originalText || 'Enviar cadastro'; }
              }
            }, true);
          })();
          </script>
          '''

          html = html.replace('</head>', css + '</head>', 1)
          html = html.replace('</body>', js + '</body>', 1)
          html = html.replace('placeholder="Código de área" required', 'placeholder="DDD" required', 1)
          path.write_text(html, encoding='utf-8')
          print('Correção profissional do WhatsApp internacional aplicada.')
          PY

      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: WhatsApp internacional e validação do telefone'
          git push
