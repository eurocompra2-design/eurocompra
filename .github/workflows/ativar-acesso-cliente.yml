name: Ativar acesso do cliente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 scripts/ativar_acesso_cliente.py
      - name: Aplicar acesso somente por codigo
        run: python3 scripts/acesso_somente_codigo.py
      - name: Aplicar design profissional
        run: python3 scripts/profissionalizar_entrada.py
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: acesso do cliente somente por codigo [skip ci]"
          git push
