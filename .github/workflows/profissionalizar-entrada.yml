name: Profissionalizar entrada do cliente
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar design profissional
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<section id="entradaEuroCompra"')
          end=s.find('<section id="cadastro"', start)
          if start < 0 or end < 0:
              raise SystemExit('seção de entrada não encontrada')
          section='''<section id="entradaEuroCompra" class="form-section"><div class="container"><div class="access-panel"><div class="access-heading"><span class="access-badge">EUROCOMPRA</span><h2>Como você deseja continuar?</h2><p>Escolha uma opção para acessar os serviços da EuroCompra.</p></div><div class="access-options"><article class="access-card"><div class="access-icon">📝</div><div class="access-content"><span class="access-label">NOVO CLIENTE</span><h3>Ainda não tenho cadastro</h3><p>Crie seu cadastro gratuitamente e envie sua primeira solicitação de compra.</p><button id="novoCadastroBtn" class="access-button access-primary" type="button">Criar meu cadastro <span>→</span></button></div></article><article class="access-card access-existing"><div class="access-icon">🔐</div><div class="access-content"><span class="access-label">CLIENTE CADASTRADO</span><h3>Já sou cliente</h3><p>Entre com seu código de cadastro e sua senha para continuar.</p><button id="acessoClienteBtn" class="access-button access-gold" type="button">Acessar meu cadastro <span>→</span></button></div></article></div><div class="access-security">🔒 <span>Seus dados são tratados com segurança.</span></div></div></div></section>'''
          s=s[:start]+section+s[end:]
          css='''<style id="eurocompra-access-pro">.access-panel{max-width:980px;margin:auto}.access-heading{text-align:center;margin-bottom:32px}.access-badge{display:inline-block;background:#eaf1ff;color:#063b9e;border:1px solid #d8e5ff;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:1.4px}.access-heading h2{font-size:clamp(30px,4vw,42px);line-height:1.15;color:#06245c;margin:14px 0 10px}.access-heading p{color:#667085;font-size:16px;margin:0}.access-options{display:grid;grid-template-columns:1fr 1fr;gap:22px}.access-card{background:#fff;border:1px solid #e2e7f0;border-radius:22px;padding:28px;display:flex;gap:20px;box-shadow:0 12px 35px rgba(6,59,158,.07);transition:transform .2s,box-shadow .2s,border-color .2s}.access-card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(6,59,158,.12);border-color:#c9d8f2}.access-icon{width:58px;height:58px;min-width:58px;border-radius:16px;background:#f0f5ff;display:grid;place-items:center;font-size:28px}.access-existing .access-icon{background:#fff7df}.access-content{flex:1}.access-label{font-size:11px;font-weight:800;letter-spacing:1.1px;color:#667085}.access-content h3{font-size:22px;color:#06245c;margin:7px 0 8px}.access-content p{font-size:14px;color:#667085;line-height:1.55;margin:0 0 20px}.access-button{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:opacity .2s}.access-button:hover{opacity:.9}.access-primary{background:#063b9e;color:#fff}.access-gold{background:#f4b942;color:#172033}.access-security{text-align:center;color:#667085;font-size:12px;margin-top:20px}.access-security span{margin-left:5px}@media(max-width:700px){.access-options{grid-template-columns:1fr}.access-card{padding:22px}.access-content h3{font-size:20px}} </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: tela profissional de entrada do cliente [skip ci]" || exit 0
          git push origin HEAD:main
      - name: Remover workflow temporário
        if: always()
        run: |
          git rm .github/workflows/profissionalizar-entrada.yml || true
          git commit -m "chore: remover workflow temporário [skip ci]" || true
          git push origin HEAD:main || true
