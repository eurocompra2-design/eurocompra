name: Ajustar opções de entrada do cliente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar index
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="entradaEuroCompra"' not in s:
              escolha = '''<section id="entradaEuroCompra" class="form-section"><div class="container"><div class="form-box"><div class="form-header"><h2>Como você deseja continuar?</h2><p>Escolha uma das opções abaixo.</p></div><div class="cards"><div class="card" style="text-align:center"><div style="font-size:42px">📝</div><h3>Novo cadastro</h3><p>Para quem ainda não possui cadastro na EuroCompra.</p><button id="novoCadastroBtn" class="btn primary" type="button">Fazer cadastro</button></div><div class="card" style="text-align:center"><div style="font-size:42px">🔐</div><h3>Já sou cliente</h3><p>Para quem já fez o cadastro e possui código e senha.</p><button id="acessoClienteBtn" class="btn gold" type="button">Entrar no meu cadastro</button></div></div></div></div></section>'''
              s = s.replace('<section id="cadastro" class="form-section">', escolha + '<section id="cadastro" class="form-section">', 1)

          old = '''const showAccess=()=>{if(formSec)formSec.style.display='none';if(sec)sec.style.display='block';sec.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('a[href="#cadastro"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showAccess()}));if(location.hash==='#cadastro')setTimeout(showAccess,0);'''
          new = '''const entrada=document.getElementById('entradaEuroCompra');const showChoice=()=>{if(entrada)entrada.style.display='block';if(formSec)formSec.style.display='none';if(sec)sec.style.display='none';entrada?.scrollIntoView({behavior:'smooth',block:'start'})};const showRegister=()=>{if(entrada)entrada.style.display='none';if(sec)sec.style.display='none';if(formSec)formSec.style.display='block';formSec?.scrollIntoView({behavior:'smooth',block:'start'})};const showAccess=()=>{if(entrada)entrada.style.display='none';if(formSec)formSec.style.display='none';if(sec)sec.style.display='block';sec.scrollIntoView({behavior:'smooth',block:'start'})};document.querySelectorAll('a[href="#cadastro"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showChoice()}));document.getElementById('novoCadastroBtn')?.addEventListener('click',showRegister);document.getElementById('acessoClienteBtn')?.addEventListener('click',showAccess);if(location.hash==='#cadastro')setTimeout(showChoice,0);else setTimeout(showChoice,0);'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              s = re.sub(r"const showAccess=\(\)=>\{if\(formSec\).*?if\(location\.hash==='#cadastro'\)setTimeout\(showAccess,0\);", new, s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: separar novo cadastro e acesso do cliente [skip ci]"
          git push origin HEAD:main
