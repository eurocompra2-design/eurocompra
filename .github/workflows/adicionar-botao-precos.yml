name: Adicionar botão Preços

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  adicionar-precos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Adicionar botão Preços no cabeçalho
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          if "data-eurocompra-precos" in html:
              print("Botão Preços já existe.")
              raise SystemExit(0)

          # Botão visível no celular, ao lado do botão principal existente.
          mobile_css = '''\n    .mobile-precos {\n      display: none;\n      align-items: center;\n      justify-content: center;\n      padding: 10px 13px;\n      border-radius: 11px;\n      background: var(--dourado);\n      color: var(--texto);\n      font-size: 13px;\n      font-weight: 800;\n      white-space: nowrap;\n    }\n\n    @media (max-width: 850px) {\n      .mobile-precos {\n        display: inline-flex;\n      }\n    }\n'''

          marker = "    /* MOBILE */"
          if marker in html:
              html = html.replace(marker, mobile_css + "\n" + marker, 1)
          else:
              html = html.replace("  </style>", mobile_css + "\n  </style>", 1)

          button = '<a data-eurocompra-precos class="mobile-precos" href="precos.html">💰 Preços</a>'

          # Insere o botão antes do fechamento do bloco principal do cabeçalho.
          header_end = "    </div>\n  </header>"
          if header_end in html:
              html = html.replace(header_end, "      " + button + "\n\n    </div>\n  </header>", 1)
          else:
              raise SystemExit("Não encontrei o fechamento esperado do cabeçalho.")

          path.write_text(html, encoding="utf-8")
          print("Botão Preços adicionado.")

      - name: Publicar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar botão Preços no site" || exit 0
          git push

      - name: Remover workflow temporário
        shell: bash
        run: |
          rm -f .github/workflows/adicionar-botao-precos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/adicionar-botao-precos.yml
          git commit -m "Remover workflow temporário" || exit 0
          git push
