name: Ativar busca de lojas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ativar-busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir scripts das lojas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="busca-lojas.js"></script>','<script src="doces-lojas.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ativar categoria de doces"
          git push
