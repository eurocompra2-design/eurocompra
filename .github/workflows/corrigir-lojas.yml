name: Corrigir clique das lojas

on:
  push:
    branches: [main]

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[lojas-ok]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Corrigir lojas e busca
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
/* CORREÇÃO DAS LOJAS */
.lojas-categorias{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.lojas-categorias .loja-card{cursor:pointer;position:relative}.lojas-categorias .loja-card h3{margin-bottom:7px}.lojas-lista-aberta{display:none;grid-column:1/-1;background:#fff;border:1px solid var(--borda);border-radius:15px;padding:18px;margin-top:-5px}.lojas-lista-aberta.ativa{display:block}.lojas-lista-aberta a{display:block;padding:11px 12px;border-bottom:1px solid var(--borda);color:var(--azul);font-weight:700}.lojas-lista-aberta a:last-child{border-bottom:0}.lojas-lista-aberta a:hover{color:var(--azul)}@media(max-width:850px){.lojas-categorias{grid-template-columns:1fr}}
'''
          if '/* CORREÇÃO DAS LOJAS */' not in s:
              s=s.replace('</style>', css+'  </style>',1)
          js = r'''
<script>
/* CORREÇÃO DAS LOJAS JS */
(function(){
  const listas={
    'Moda':['Zara','H&M','C&A','Primark','Mango','Uniqlo'],
    'Eletrônicos':['MediaMarkt','Coolblue','Apple','Fnac','Krëfel'],
    'Casa':['IKEA','Action','JYSK','Casa','Maisons du Monde']
  };
  const urls={
    'zara':'https://www.zara.com/be/','h&m':'https://www2.hm.com/en_be/index.html','c&a':'https://www.c-and-a.com/be/en/shop','primark':'https://www.primark.com/en-be','mango':'https://shop.mango.com/be/en','uniqlo':'https://www.uniqlo.com/be/en/','mediamarkt':'https://www.mediamarkt.be/','coolblue':'https://www.coolblue.be/','apple':'https://www.apple.com/be/','fnac':'https://www.nl.fnac.be/','krëfel':'https://www.krefel.be/','ikea':'https://www.ikea.com/be/en/','action':'https://www.action.com/en-be/','jysk':'https://jysk.be/','casa':'https://www.casashops.com/en-be/','maisons du monde':'https://www.maisonsdumonde.com/BE/en/'
  };
  const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  function openCategory(card){
    const title=(card.querySelector('h3,strong')||{}).textContent||'';
    const clean=title.replace(/^[^A-Za-zÀ-ÿ]+/,'').trim();
    const key=Object.keys(listas).find(k=>norm(clean).includes(norm(k)));
    if(!key)return false;
    const parent=card.parentElement;
    const old=parent.querySelector('.lojas-lista-aberta');
    if(old)old.remove();
    const box=document.createElement('div');
    box.className='lojas-lista-aberta ativa';
    box.innerHTML='<strong>'+key+' — lojas na Bélgica</strong>'+listas[key].map(n=>{const u=urls[n.toLowerCase()]||'#';return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+n+' ↗</a>';}).join('');
    parent.appendChild(box);
    return true;
  }
  document.addEventListener('click',function(e){
    const card=e.target.closest('.loja-card');
    if(!card)return;
    if(openCategory(card))e.preventDefault();
  });
  function setupSearch(){
    const input=document.querySelector('.lojas-search input');
    if(!input)return;
    const container=document.querySelector('.lojas-categorias');
    if(!container)return;
    const cards=Array.from(container.querySelectorAll('.loja-card'));
    const noResult=document.createElement('div');
    noResult.className='lojas-busca-vazia';
    noResult.style.cssText='display:none;grid-column:1/-1;padding:18px;text-align:center;background:#fff;border:1px solid var(--borda);border-radius:15px;color:var(--muted)';
    noResult.textContent='Nenhuma loja encontrada. Tente outro nome, marca ou categoria.';
    container.appendChild(noResult);
    input.addEventListener('input',function(){
      const q=norm(input.value);
      let count=0;
      cards.forEach(card=>{
        const text=norm(card.textContent);
        const show=!q||text.includes(q);
        card.style.display=show?'':'none';
        if(show)count++;
      });
      noResult.style.display=count?'none':'block';
      const opened=container.querySelector('.lojas-lista-aberta');
      if(opened)opened.remove();
    });
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        const first=cards.find(c=>c.style.display!=='none');
        if(first && norm(input.value))openCategory(first);
      }
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupSearch);
  else setupSearch();
})();
</script>
'''
          marker='/* CORREÇÃO DAS LOJAS JS */'
          if marker not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir busca e abertura das lojas [lojas-ok]"
          git push

# disparo da correção funcional da busca das lojas
