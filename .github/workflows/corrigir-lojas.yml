name: Ativar busca de lojas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ativar-busca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir scripts das lojas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="doces-lojas.js"></script>', '')
          import re
          s=re.sub(r'<script src="categorias-profissionais\.js(?:\?[^\"]*)?"></script>', '<script src="categorias-profissionais.js?v=20260816"></script>', s)
          tags=[
            '<script src="busca-lojas.js"></script>',
            '<script src="chocolates-visivel.js"></script>',
            '<script src="categorias-profissionais.js?v=20260816"></script>',
            '<script src="horario-whatsapp.js?v=20260816"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adicionar horario profissional de atendimento WhatsApp"
          git push
