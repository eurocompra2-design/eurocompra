name: Atualizar lojas EuroCompra

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover buscador de lojas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="doces-lojas.js"></script>', '')
          s=s.replace('<script src="busca-lojas.js"></script>', '')
          # Remove qualquer script de busca de lojas que tenha sido inserido antes.
          s=re.sub(r'<script[^>]+busca-lojas\.js[^>]*></script>', '', s)
          # Mantém os scripts atuais das lojas, chocolates e horário.
          s=re.sub(r'<script src="categorias-profissionais\.js(?:\?[^\"]*)?"></script>', '<script src="categorias-profissionais.js?v=20260816"></script>', s)
          tags=['<script src="chocolates-visivel.js"></script>','<script src="categorias-profissionais.js?v=20260816"></script>','<script src="horario-whatsapp.js?v=20260816"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          # Esconde qualquer campo/botão de busca de lojas que tenha ficado no HTML antigo.
          css='<style id="ec-remove-store-search">.lojas-search,.ec-store-search,#busca-lojas{display:none!important}</style>'
          if 'id="ec-remove-store-search"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remover buscador de lojas"
          git push
