name: Corrigir clique das lojas

on:
  push:
    branches: [main]

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[lojas-ok]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Corrigir lojas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* CORREÇÃO DAS LOJAS */\n.lojas-categorias{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.lojas-categorias .loja-card{cursor:pointer;position:relative}.lojas-categorias .loja-card h3{margin-bottom:7px}.lojas-lista-aberta{display:none;grid-column:1/-1;background:#fff;border:1px solid var(--borda);border-radius:15px;padding:18px;margin-top:-5px}.lojas-lista-aberta.ativa{display:block}.lojas-lista-aberta a{display:block;padding:11px 12px;border-bottom:1px solid var(--borda);color:var(--azul-escuro);font-weight:700}.lojas-lista-aberta a:last-child{border-bottom:0}.lojas-lista-aberta a:hover{color:var(--azul)}@media(max-width:850px){.lojas-categorias{grid-template-columns:1fr}}\n'''
          if '/* CORREÇÃO DAS LOJAS */' not in s:
              s=s.replace('</style>', css+'  </style>',1)
          js = r'''\n<script>\n(function(){\n  const listas={\n    'Moda':['Zara','H&M','C&A','Primark','Mango','Uniqlo'],\n    'Eletrônicos':['MediaMarkt','Coolblue','Apple','Fnac','Krëfel'],\n    'Casa':['IKEA','Action','JYSK','Casa','Maisons du Monde']\n  };\n  const urls={\n    'zara':'https://www.zara.com/be/','h&m':'https://www2.hm.com/en_be/index.html','c&a':'https://www.c-and-a.com/be/en/shop','primark':'https://www.primark.com/en-be','mango':'https://shop.mango.com/be/en','uniqlo':'https://www.uniqlo.com/be/en/','mediamarkt':'https://www.mediamarkt.be/','coolblue':'https://www.coolblue.be/','apple':'https://www.apple.com/be/','fnac':'https://www.nl.fnac.be/','krëfel':'https://www.krefel.be/','ikea':'https://www.ikea.com/be/en/','action':'https://www.action.com/en-be/','jysk':'https://jysk.be/','casa':'https://www.casashops.com/en-be/','maisons du monde':'https://www.maisonsdumonde.com/BE/en/'\n  };\n  document.addEventListener('click',function(e){\n    const card=e.target.closest('.loja-card');\n    if(!card) return;\n    const title=(card.querySelector('h3,strong')||{}).textContent||'';\n    const clean=title.replace(/^[^A-Za-zÀ-ÿ]+/,'').trim();\n    const key=Object.keys(listas).find(k=>clean.toLowerCase().includes(k.toLowerCase()));\n    if(key){\n      e.preventDefault();\n      const old=card.parentElement.querySelector('.lojas-lista-aberta');\n      if(old) old.remove();\n      const box=document.createElement('div');\n      box.className='lojas-lista-aberta ativa';\n      box.innerHTML='<strong>'+key+' — lojas na Bélgica</strong>'+listas[key].map(n=>{const u=urls[n.toLowerCase()]||'#';return '<a href="'+u+'" target="_blank" rel="noopener">'+n+' ↗</a>';}).join('');\n      card.parentElement.appendChild(box);\n      return;\n    }\n    const name=clean.toLowerCase();\n    const u=Object.keys(urls).find(k=>name.includes(k));\n    if(u&&urls[u]!=='#'){ e.preventDefault(); window.open(urls[u],'_blank','noopener'); }\n  });\n})();\n</script>\n'''
          if '/* CORREÇÃO DAS LOJAS */' in s and 'lojas-lista-aberta' not in s.split('</style>',1)[1]:
              pass
          if 'CORREÇÃO DAS LOJAS JS' not in s:
              js=js.replace('<script>','<script>\n/* CORREÇÃO DAS LOJAS JS */',1)
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir clique e abertura das lojas [lojas-ok]"
          git push
