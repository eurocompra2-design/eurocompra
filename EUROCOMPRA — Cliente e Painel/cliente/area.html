<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EuroCompra | Minha Área</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.top{background:#063b9e;color:#fff;padding:22px}.wrap{max-width:1050px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 6px 22px #0000000b}.num{font-size:22px;font-weight:800;color:#063b9e}.muted{color:#68748a}.section{margin-top:22px}.logout{border:0;border-radius:9px;padding:10px 15px;background:#fff;color:#063b9e;font-weight:700;cursor:pointer}.pedido{border-top:1px solid #e5e9f1;padding:14px 0}.pedido:first-child{border-top:0}.empty{color:#68748a}</style></head><body><header class="top"><div class="wrap"><strong>EuroCompra</strong><br><span>Minha Área</span></div></header><main class="wrap"><h1 id="saudacao">Olá!</h1><p class="muted">Acompanhe aqui suas compras, envios, pagamentos e histórico.</p><section class="grid"><div class="card"><div id="qCompras" class="num">0</div><p class="muted">Compras/pedidos</p></div><div class="card"><div id="qEnvios" class="num">0</div><p class="muted">Envios</p></div><div class="card"><div id="qPagamentos" class="num">0</div><p class="muted">Pagamentos registrados</p></div><div class="card"><div id="statusConta" class="num">—</div><p class="muted">Status do cadastro</p></div></section><section class="card section"><h2>Minhas compras e envios</h2><div id="pedidos"><p class="empty">Nenhuma compra ou envio registrado ainda.</p></div></section><section class="card section"><h2>Meus dados</h2><p id="dados" class="muted">Carregando...</p></section><section class="card section"><h2>Seu código</h2><p id="codigo" class="muted"></p></section><button class="logout" onclick="sair()">Sair</button></main><script>const codigo=sessionStorage.getItem('eurocompra_codigo')||'';const cliente=JSON.parse(sessionStorage.getItem('eurocompra_cliente')||'{}');const pedidos=JSON.parse(sessionStorage.getItem('eurocompra_pedidos')||'[]');if(!codigo||!cliente.codigo){location.href='acesso.html'}else{document.getElementById('saudacao').textContent='Olá, '+(cliente.nome||'cliente')+'!';document.getElementById('codigo').textContent='Código: '+codigo;document.getElementById('statusConta').textContent=cliente.status||'Ativo';document.getElementById('qCompras').textContent=pedidos.length;document.getElementById('qEnvios').textContent=pedidos.filter(p=>p.rastreamento||p.codigo_rastreio||p.envio_status||p.status_envio).length;document.getElementById('qPagamentos').textContent=pedidos.filter(p=>p.pagamento||p.status_pagamento).length;document.getElementById('dados').textContent=[cliente.email,cliente.whatsapp,cliente.servico].filter(Boolean).join(' • ')||'Dados disponíveis no cadastro';const box=document.getElementById('pedidos');if(pedidos.length){box.innerHTML=pedidos.map((p,i)=>{const titulo=p.produto||p.descricao||p.nome||('Pedido '+(i+1));const status=p.status||p.status_envio||'Em acompanhamento';const rast=p.rastreamento||p.codigo_rastreio||'';return '<div class="pedido"><strong>'+esc(titulo)+'</strong><br><span class="muted">Status: '+esc(status)+(rast?' • Rastreio: '+esc(rast):'')+'</span></div>'}).join('')}}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function sair(){sessionStorage.removeItem('eurocompra_codigo');sessionStorage.removeItem('eurocompra_cliente');sessionStorage.removeItem('eurocompra_pedidos');location.href='acesso.html'}</script></body></html>
