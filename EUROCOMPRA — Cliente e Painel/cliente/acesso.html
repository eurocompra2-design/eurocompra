<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EuroCompra | Acesso do Cliente</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 35px #00000012}.logo{font-size:26px;font-weight:800;color:#063b9e;margin-bottom:8px}h1{margin:0 0 8px;font-size:24px}p{color:#657085;line-height:1.5}.code{width:100%;padding:15px;border:1px solid #d8deea;border-radius:10px;font-size:18px;letter-spacing:2px;text-align:center;margin:12px 0}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#063b9e;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.status{margin-top:15px;font-size:14px;min-height:20px;text-align:center}.note{font-size:13px;margin-top:14px;text-align:center}</style></head><body><section class="card"><div class="logo">EuroCompra</div><h1>Área do Cliente</h1><p>Digite o código de acesso recebido no seu cadastro. Não é necessário utilizar senha.</p><input id="codigo" class="code" type="text" autocomplete="off" placeholder="EC-20260815-XXXXXX"><button id="btn" class="btn" onclick="entrar()">Acessar minha área</button><div id="status" class="status"></div><div class="note">Acesso individual às suas compras e envios.</div></section><script src="api-config.js"></script><script>async function entrar(){const codigo=document.getElementById('codigo').value.trim().toUpperCase();const status=document.getElementById('status');const btn=document.getElementById('btn');if(!codigo){status.textContent='Digite seu código de acesso.';return}btn.disabled=true;status.textContent='Verificando código...';try{const r=await fetch(EUROCOMPRA_API+'/api/acesso/codigo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo})});const data=await r.json();if(!r.ok||!data.ok){status.textContent=data.message||'Código não encontrado.';btn.disabled=false;return}sessionStorage.setItem('eurocompra_codigo',codigo);sessionStorage.setItem('eurocompra_cliente',JSON.stringify(data.cliente||{}));sessionStorage.setItem('eurocompra_pedidos',JSON.stringify(data.pedidos||[]));window.location.href='area.html'}catch(e){status.textContent='Não foi possível conectar ao sistema. Tente novamente.';btn.disabled=false}}</script></body></html>
